name: Run C# Web API Tests

# Когда запускать пайплайн
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код репозитория на виртуальную машину
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Настраиваем окружение .NET 8
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    # 3. Восстанавливаем зависимости (Nuget-пакеты)
    - name: Restore dependencies
      run: dotnet restore

    # 4. Собираем проект
    - name: Build project
      run: dotnet build --no-restore

    # 5. Запуск тестов с явным указанием Allure Config
    - name: Run unit & API tests
      run: dotnet test --no-build --verbosity normal
      env:
        ALLURE_CONFIG: ${{ github.workspace }}/allureConfig.json

    # 6. Загрузка артефакта Allure
    - name: Upload Allure Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: "**/bin/Debug/net9.0/allure-results"